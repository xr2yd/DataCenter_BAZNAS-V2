name: Validate and Deploy BAZNAS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate backend
        run: |
          npm ci
          node --test server/access-policy.test.js server/access-control.integration.test.js server/repository.metrics.test.js server/audit-log.test.js server/public-tracking.repository.test.js server/runtime-policy.test.js deploy/release-vps.test.js

      - name: Validate frontend
        working-directory: frontend-next
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Configure VPS SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy validated commit on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USERNAME@$VPS_HOST" \
            "git -C /home/xruncy/repo fetch --no-tags origin main && git -C /home/xruncy/repo show $TARGET_SHA:deploy/release-vps.sh | bash -s -- $TARGET_SHA"
