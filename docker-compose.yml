services:
  backend:
    container_name: baznas-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
      - ./.env:/app/.env:ro

  frontend:
    container_name: baznas-frontend
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: "host"
    environment:
      - NODE_ENV=production
      - PORT=3002
    depends_on:
      - backend
